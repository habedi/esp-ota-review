name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check the flake
        run: nix flake check --no-build

      - name: Run pre-commit hooks
        run: nix develop -c make hooks

      - name: Install QEMU runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgcrypt20 libglib2.0-0t64 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: Install the pinned SDKs and tools
        run: nix develop -c make setup

      - name: Run host unit tests
        run: nix develop -c build/ota-qemu/venv/bin/python -m unittest discover -s tests/reproduce-bugs/test

      - name: Run ESP32 QEMU tests
        run: nix develop -c make test test-fixed

      - name: Build the presentation
        run: nix develop -c make pres

      - name: Upload test results and presentation
        uses: actions/upload-artifact@v7
        with:
          name: ota-review
          path: |
            build/ota-qemu/*-results.csv
            build/presentation/zaptec-tech-case-pres.pdf
          if-no-files-found: error
